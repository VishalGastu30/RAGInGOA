name: Sync to Hugging Face
on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Sync to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Replace 'YOUR_HF_USERNAME' with your actual Hugging Face username if it's not VishalGastu30
          git push --force https://OmnipotentFool:$HF_TOKEN@huggingface.co/spaces/VishalGastu30/ragingoa-backend main

