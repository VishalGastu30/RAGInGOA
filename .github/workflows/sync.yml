name: Sync to Hugging Face
on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Sync to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Install huggingface_hub
          pip install huggingface_hub
          
          # Upload the entire repository to the Space using the new hf CLI, bypassing Git LFS binary history errors
          hf upload OmnipotentFool/ragingoa-backend . . --repo-type space --commit-message "Sync from GitHub"
