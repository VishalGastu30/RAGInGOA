name: Sync to Hugging Face
on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          lfs: true
      - name: Sync to Hugging Face
        uses: huggingface/hub-sync@v1
        with:
          # We'll ask the user to specify their exact Space name here later, 
          # or we can leave a placeholder
          repo: "VishalGastu30/ragingoa-backend" 
          token: ${{ secrets.HF_TOKEN }}
